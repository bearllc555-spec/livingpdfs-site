# Deploy static site to Cloudflare Pages on every branch push.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN  — Account -> Cloudflare Pages -> Edit
#   CLOUDFLARE_ACCOUNT_ID — e0f6f68f26f8a26a75eaa793385019ef
#
# Branch previews: <branch-slug>.livingpdfs.pages.dev
# Production branch on CF: dev -> https://livingpdfs.pages.dev/

name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 003/package-lock.json

      - name: Build site (003 at root)
        run: node scripts/build-site.mjs

      - name: Compute branch slug
        id: slug
        run: echo "slug=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=livingpdfs --branch=${{ steps.slug.outputs.slug }} --commit-dirty=true
