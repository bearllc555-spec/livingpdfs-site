# Deploy Vite build to Cloudflare Pages (project: livingpdfs).
#
# Required GitHub repo secrets:
#   CLOUDFLARE_API_TOKEN  - Account -> Cloudflare Pages -> Edit
#   CLOUDFLARE_ACCOUNT_ID - e0f6f68f26f8a26a75eaa793385019ef
#
# dev branch pushes deploy to CF branch "dev" (production: livingpdfs.com).
# Other branches: preview at <branch-slug>.livingpdfs.pages.dev

name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
          node scripts/prepare-pages.mjs

      - name: Cloudflare branch
        id: cf
        run: |
          if [ "${{ github.ref_name }}" = "dev" ] || [ "${{ github.ref_name }}" = "main" ]; then
            echo "branch=dev" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Wrangler
        run: npm install -g wrangler@3.90.0

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          wrangler pages deploy _pages
          --project-name=livingpdfs
          --branch=${{ steps.cf.outputs.branch }}
          --commit-dirty=true
