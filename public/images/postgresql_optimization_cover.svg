<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f44" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0" />
      <stop offset="92%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  
  <!-- Base background -->
  <rect width="300" height="400" fill="url(#bgGrad)" />
  
  <!-- Vignette overlay for depth -->
  <rect width="300" height="400" fill="url(#vignette)" />

  <!-- Grid lines -->
  <path d="M 0 40 L 300 40 M 0 80 L 300 80 M 0 120 L 300 120 M 0 160 L 300 160 M 0 200 L 300 200 M 0 240 L 300 240 M 0 280 L 300 280 M 0 320 L 300 320 M 0 360 L 300 360" stroke="rgba(6, 182, 212, 0.05)" stroke-width="1" />
  <path d="M 30 0 L 30 400 M 60 0 L 60 400 M 90 0 L 90 400 M 120 0 L 120 400 M 150 0 L 150 400 M 180 0 L 180 400 M 210 0 L 210 400 M 240 0 L 240 400 M 270 0 L 270 400" stroke="rgba(6, 182, 212, 0.05)" stroke-width="1" />

  <!-- Technical blueprint lines & circular paths -->
  <circle cx="150" cy="180" r="52" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.3" />
  <circle cx="150" cy="180" r="62" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="3, 5" />
  <circle cx="150" cy="180" r="42" fill="none" stroke="rgba(34, 211, 238, 0.2)" stroke-dasharray="8, 4" />
  
  <!-- Database Emblem -->
  <g transform="translate(132, 162)">
    <path d="M4,7 C4,10 16,10 16,7 C16,4 4,4 4,7" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" />
    <path d="M4,7 L4,13 C4,16 16,16 16,13 L16,7" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" />
    <path d="M4,13 L4,19 C4,22 16,22 16,19 L16,13" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" />
    <path d="M10,2 L10,5" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="2,2" />
  </g>

  <!-- Typography & Styling -->
  <text x="150" y="270" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="900" letter-spacing="3" text-anchor="middle">DATABASE &amp; ANALYTICS</text>
  
  <text x="150" y="300" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="900" letter-spacing="-0.5" text-anchor="middle">POSTGRESQL</text>
  <text x="150" y="316" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="900" letter-spacing="-0.5" text-anchor="middle">PERFORMANCE</text>
  <text x="150" y="332" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="950" letter-spacing="-0.5" text-anchor="middle">OPTIMIZATION</text>
  
  <text x="150" y="352" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" letter-spacing="1" text-anchor="middle">DANTE ALIGHIERI</text>

  <!-- Header badge -->
  <rect x="15" y="15" width="270" height="20" fill="rgba(255,255,255,0.05)" rx="3" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="25" y="27" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="bold" letter-spacing="1">LIVING PDF SERIES</text>
  <text x="275" y="27" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="black" text-anchor="end">v1.3.1</text>
  
  <!-- Footer elements -->
  <path d="M 15 370 L 285 370" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <text x="15" y="384" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="bold">45 PAGES</text>
  
  <!-- Barcode -->
  <g transform="translate(215, 375)">
    <rect x="0" y="0" width="1.5" height="12" fill="#94a3b8" />
    <rect x="3" y="0" width="0.5" height="12" fill="#94a3b8" />
    <rect x="5" y="0" width="2" height="12" fill="#94a3b8" />
    <rect x="9" y="0" width="1" height="12" fill="#94a3b8" />
    <rect x="11" y="0" width="0.5" height="12" fill="#94a3b8" />
    <rect x="13" y="0" width="1.5" height="12" fill="#94a3b8" />
    <rect x="16" y="0" width="0.5" height="12" fill="#94a3b8" />
    <rect x="18" y="0" width="1.5" height="12" fill="#94a3b8" />
    <rect x="21" y="0" width="2" height="12" fill="#94a3b8" />
    <rect x="25" y="0" width="1" height="12" fill="#94a3b8" />
    <rect x="28" y="0" width="2" height="12" fill="#94a3b8" />
    <rect x="31" y="0" width="0.5" height="12" fill="#94a3b8" />
    <rect x="33" y="0" width="1.5" height="12" fill="#94a3b8" />
    <rect x="36" y="0" width="1" height="12" fill="#94a3b8" />
    <rect x="40" y="0" width="2" height="12" fill="#94a3b8" />
    <rect x="44" y="0" width="0.5" height="12" fill="#94a3b8" />
    <rect x="46" y="0" width="2.5" height="12" fill="#94a3b8" />
    <rect x="50" y="0" width="1" height="12" fill="#94a3b8" />
    <rect x="52" y="0" width="1.5" height="12" fill="#94a3b8" />
    <rect x="55" y="0" width="0.5" height="12" fill="#94a3b8" />
  </g>

  <!-- 3D book spine shadow -->
  <rect x="0" y="0" width="12" height="400" fill="url(#spineGrad)" />
</svg>
