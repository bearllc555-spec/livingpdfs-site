<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#02000a" />
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.88" />
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0" />
      <stop offset="92%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  
  <!-- Base background -->
  <rect width="300" height="400" fill="url(#bgGrad)" />
  
  <!-- Vignette overlay for depth -->
  <rect width="300" height="400" fill="url(#vignette)" />

  <!-- Grid lines -->
  <path d="M 0 40 L 300 40 M 0 80 L 300 80 M 0 120 L 300 120 M 0 160 L 300 160 M 0 200 L 300 200 M 0 240 L 300 240 M 0 280 L 300 280 M 0 320 L 300 320 M 0 360 L 300 360" stroke="rgba(168, 85, 247, 0.05)" stroke-width="1" />
  <path d="M 30 0 L 30 400 M 60 0 L 60 400 M 90 0 L 90 400 M 120 0 L 120 400 M 150 0 L 150 400 M 180 0 L 180 400 M 210 0 L 210 400 M 240 0 L 240 400 M 270 0 L 270 400" stroke="rgba(168, 85, 247, 0.05)" stroke-width="1" />

  <!-- Technical blueprint lines (Astrophysics Orbital Grids) -->
  <circle cx="150" cy="180" r="54" fill="none" stroke="url(#accentGrad)" stroke-width="1.2" stroke-opacity="0.4" />
  <circle cx="150" cy="180" r="35" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="3, 4" />
  <circle cx="150" cy="180" r="16" fill="none" stroke="rgba(139, 92, 246, 0.2)" stroke-dasharray="10, 3" />
  
  <!-- Planet / Celestial alignment graphics -->
  <circle cx="112" cy="142" r="5" fill="#a855f7" />
  <circle cx="188" cy="218" r="3" fill="#6366f1" />
  <circle cx="150" cy="180" r="8" fill="#ffffff" opacity="0.9" />

  <!-- Radiating light rays -->
  <line x1="150" y1="110" x2="150" y2="250" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" stroke-dasharray="5, 5" />
  <line x1="80" y1="180" x2="220" y2="180" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" stroke-dasharray="5, 5" />

  <!-- Typography & Styling -->
  <text x="150" y="270" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="900" letter-spacing="3" text-anchor="middle">ASTRONOMY &amp; SPECTROSCOPY</text>
  
  <text x="150" y="300" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="900" letter-spacing="-0.5" text-anchor="middle">ASTROPHYSICS DATA</text>
  <text x="150" y="316" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="900" letter-spacing="-0.5" text-anchor="middle">PIPELINES IN JUPYTER</text>
  <text x="150" y="332" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="950" letter-spacing="-0.5" text-anchor="middle">&amp; SPECTRAL ANALYSIS</text>
  
  <text x="150" y="352" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" letter-spacing="1" text-anchor="middle">CARL SAGAN</text>

  <!-- Header badge -->
  <rect x="15" y="15" width="270" height="20" fill="rgba(255,255,255,0.05)" rx="3" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="25" y="27" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="bold" letter-spacing="1">LIVING PDF SERIES</text>
  <text x="275" y="27" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="black" text-anchor="end">v1.0.1</text>
  
  <!-- Footer elements -->
  <path d="M 15 370 L 285 370" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <text x="15" y="384" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="bold">64 PAGES</text>
  
  <!-- Barcode -->
  <g transform="translate(215, 375)">
    <rect x="0" y="0" width="1.5" height="12" fill="#94a3b8" />
    <rect x="3" y="0" width="0.5" height="12" fill="#94a3b8" />
    <rect x="5" y="0" width="2" height="12" fill="#94a3b8" />
    <rect x="9" y="0" width="1" height="12" fill="#94a3b8" />
    <rect x="11" y="0" width="0.5" height="12" fill="#94a3b8" />
    <rect x="13" y="0" width="1.5" height="12" fill="#94a3b8" />
    <rect x="16" y="0" width="0.5" height="12" fill="#94a3b8" />
    <rect x="18" y="0" width="1.5" height="12" fill="#94a3b8" />
    <rect x="21" y="0" width="2" height="12" fill="#94a3b8" />
    <rect x="25" y="0" width="1" height="12" fill="#94a3b8" />
    <rect x="28" y="0" width="2" height="12" fill="#94a3b8" />
    <rect x="31" y="0" width="0.5" height="12" fill="#94a3b8" />
    <rect x="33" y="0" width="1.5" height="12" fill="#94a3b8" />
    <rect x="36" y="0" width="1" height="12" fill="#94a3b8" />
    <rect x="40" y="0" width="2" height="12" fill="#94a3b8" />
    <rect x="44" y="0" width="0.5" height="12" fill="#94a3b8" />
    <rect x="46" y="0" width="2.5" height="12" fill="#94a3b8" />
    <rect x="50" y="0" width="1" height="12" fill="#94a3b8" />
    <rect x="52" y="0" width="1.5" height="12" fill="#94a3b8" />
    <rect x="55" y="0" width="0.5" height="12" fill="#94a3b8" />
  </g>

  <!-- 3D book spine shadow -->
  <rect x="0" y="0" width="12" height="400" fill="url(#spineGrad)" />
</svg>
